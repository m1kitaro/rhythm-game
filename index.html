<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Beats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="screen-menu" class="screen">
    <h1>Pipe Beats</h1>
    <p class="lead">4レーンの音ゲー。<kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> で叩く（タッチ可）。</p>
    <ul id="chart-list"></ul>
    <p class="note">音が出ます。曲を選ぶと開始します。</p>
  </section>

  <section id="screen-game" class="screen" hidden>
    <div id="hud">
      <span id="hud-title"></span>
      <span id="hud-score">0</span>
      <span id="hud-combo"></span>
    </div>
    <div id="stage">
      <canvas id="game" width="480" height="640"></canvas>
      <div id="judge"></div>
    </div>
    <button id="btn-quit" type="button">やめる</button>
  </section>

  <section id="screen-result" class="screen" hidden>
    <h2>Result</h2>
    <p id="result-title"></p>
    <p id="result-rank"></p>
    <dl id="result-stats"></dl>
    <div class="actions">
      <button id="btn-retry" type="button">もう一度</button>
      <button id="btn-menu" type="button">曲選択へ</button>
    </div>
  </section>
</main>
<script src="charts.js"></script>
<script src="game.js"></script>
</body>
</html>
